name: laire_spinwheel
description: Aplikasi Undian Broadcast Profesional oleh Laire Creative Studio
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  audioplayers: ^6.1.1
  file_picker: ^8.0.0
  flutter_colorpicker: ^1.1.0
  window_manager: ^0.4.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_icons:
  android: false
  ios: false
  image_path: "assets/Preview-4.png"
  windows:
    generate: true
    image_path: "assets/Preview-4.png"
  macos:
    generate: true
    image_path: "assets/Preview-4.png"

flutter:
  uses-material-design: true
  assets:
    - assets/Preview-4.png
    - assets/spin_sound.mp3
    - assets/win_sound.mp3
